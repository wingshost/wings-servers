<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WINGS SERVERS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #131b2e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #1f293d;
        }
        h2 { text-align: center; color: #00d2ff; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2a3b5c;
            background: #0b0f19;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #00c6ff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Login Akun</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="logUser" placeholder="Username kamu">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="logPass" placeholder="Password kamu">
        </div>
        <button onclick="login()">Masuk Web</button>
        <div class="link">
            Belum punya akun? <a href="register.html">Daftar di sini</a>
        </div>
    </div>

    <script>
        function login() {
            const user = document.getElementById('logUser').value;
            const pass = document.getElementById('logPass').value;

            const savedUser = localStorage.getItem('db_user');
            const savedPass = localStorage.getItem('db_pass');

            if(user === savedUser && pass === savedPass) {
                alert('Login Berhasil!');
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'panel.html';
            } else {
                alert('Username atau password salah!');
            }
        }
    </script>
</body>
</html>
