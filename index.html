<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRISLY</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9;">

    <div style="max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <h3>Buat Pembayaran QRISLY</h3>
        
        <label>Nominal Pembayaran (Rp):</label><br>
        <input type="number" id="amount" value="10000" style="margin-bottom: 10px; width: 100%; padding: 8px;"><br>
        
        <label>Keterangan / Nama Produk:</label><br>
        <input type="text" id="note" value="Pembayaran Server Wings" style="margin-bottom: 10px; width: 100%; padding: 8px;"><br>
        
        <button onclick="buatQris()" style="background-color: #4CAF50; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; width: 100%;">Buat QRIS Sekarang</button>

        <h4>Hasil Respon API:</h4>
        <pre id="hasilQris" style="background: #f4f4f4; padding: 10px; max-height: 250px; overflow: auto;">Silakan buat pembayaran...</pre>
    </div>

    <script>
        function buatQris() {
            const apiKey = "QSVqsfcj0e9b3de3f00448abUiB6RQ0e";
            const amount = document.getElementById("amount").value;
            const note = document.getElementById("note").value;

            document.getElementById("hasilQris").innerText = "Memproses pembuatan QRIS...";

            // Endpoint uji coba QRISLY Komerce/Collaborator
            fetch("https://api-sandbox.collaborator.komerce.id/qrisly/api/v1/create", {
                method: "POST",
                headers: {
                    "x-api-key": apiKey,
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    amount: parseInt(amount),
                    note: note
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("hasilQris").innerText = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("hasilQris").innerText = "Gagal terhubung ke server pembayaran.";
            });
        }
    </script>

</body>
</html>
