<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order & Pembayaran - Wings Servers</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: white;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.3);
        }
        .logo {
            color: #00ffff;
            font-size: 24px;
            font-weight: bold;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }
        nav a:hover {
            color: #00ffff;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #1c2541;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            background: #0b132b;
            border: 1px solid #3a506b;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .info-box {
            background: #0b132b;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #3a506b;
            color: #00ffff;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">WINGS SERVERS</div>
        <nav>
            <a href="index.html">Utama</a>
            <a href="order.html">Order</a>
            <a href="register.html">Login / Register</a>
        </nav>
    </header>

    <div class="container">
        <h2>Form Pembayaran QRISLY</h2>
        
        <label>Nominal Pembayaran (Rp):</label>
        <input type="number" id="amount" value="10000">
        
        <label>Keterangan / Paket Server:</label>
        <input type="text" id="note" value="Pembayaran Server Wings">
        
        <button onclick="prosesPembayaran()">Lanjutkan ke Pembayaran</button>

        <div class="info-box" id="infoBox">
            Silakan masukkan nominal, lalu klik tombol di atas untuk memproses transaksi QRISLY Anda secara aman.
        </div>
    </div>

    <script>
        function prosesPembayaran() {
            const amount = document.getElementById("amount").value;
            const note = document.getElementById("note").value;
            
            if(!amount || amount <= 0) {
                alert("Masukkan nominal pembayaran yang valid!");
                return;
            }

            document.getElementById("infoBoxinnerHTML = "Memproses data transaksi Anda ke gerbang pembayaran Komerce...";

            // Simulasi integrasi sukses penanganan client-side tanpa terhalang CORS browser
            setTimeout(() => {
                document.getElementById("infoBox").innerHTML = `
                    <b>Transaksi Berhasil Dibuat!</b><br>
                    Nominal: Rp ${amount}<br>
                    Keterangan: ${note}<br><br>
                    <span style="color: #ffcc00;">Catatan: Untuk mode produksi (live), pemanggilan API Komerce/QRISLY wajib dilewatkan melalui server backend Anda agar kunci API tetap aman dan terhindar dari blokir CORS browser.</span>
                `;
            }, 1000);
        }
    </script>

</body>
</html>
