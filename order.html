<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Panel Pterodactyl Murah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Midtrans Snap JS Sandbox -->
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-5rQXHeYFN7eCM6Wb"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased">
    <div class="max-w-md mx-auto mt-10 p-6 bg-gray-800 rounded-xl shadow-xl border border-gray-700">
        <h2 class="text-2xl font-bold text-center mb-6 text-indigo-400">Order Panel Pterodactyl</h2>
        
        <!-- Form Pemilihan Paket -->
        <div id="form-section" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Nama Pemesan / TikTok</label>
                <input type="text" id="nama" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500" placeholder="Contoh: Kenxzo">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Pilih Paket Panel</label>
                <select id="paket" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500">
                    <option value="2gb" data-harga="2000" data-nama="Panel Pterodactyl 2 GB">Panel 2 GB - Rp 2.000</option>
                    <option value="3gb" data-harga="3000" data-nama="Panel Pterodactyl 3 GB">Panel 3 GB - Rp 3.000</option>
                    <option value="4gb" data-harga="4000" data-nama="Panel Pterodactyl 4 GB">Panel 4 GB - Rp 4.000</option>
                    <option value="5gb" data-harga="5000" data-nama="Panel Pterodactyl 5 GB">Panel 5 GB - Rp 5.000</option>
                    <option value="6gb" data-harga="6000" data-nama="Panel Pterodactyl 6 GB">Panel 6 GB - Rp 6.000</option>
                    <option value="7gb" data-harga="7000" data-nama="Panel Pterodactyl 7 GB">Panel 7 GB - Rp 7.000</option>
                    <option value="8gb" data-harga="8000" data-nama="Panel Pterodactyl 8 GB">Panel 8 GB - Rp 8.000</option>
                    <option value="9gb" data-harga="9000" data-nama="Panel Pterodactyl 9 GB">Panel 9 GB - Rp 9.000</option>
                    <option value="unlimited" data-harga="10000" data-nama="Panel Pterodactyl Unlimited">Panel Unlimited - Rp 10.000</option>
                </select>
            </div>
            <button onclick="buatPesanan()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-semibold rounded-lg transition duration-200 shadow-lg">Lanjut Pembayaran QRIS</button>
        </div>

        <div id="loading-section" class="hidden text-center py-6">
            <p class="text-indigo-400">Membuat transaksi pembayaran...</p>
        </div>
    </div>

    <script>
        function buatPesanan() {
            const nama = document.getElementById('nama').value;
            const selectPaket = document.getElementById('paket');
            const selectedOption = selectPaket.options[selectPaket.selectedIndex];
            
            if (!nama) {
                alert('Silakan masukkan nama pemesan terlebih dahulu!');
                return;
            }

            const harga = parseInt(selectedOption.getAttribute('data-harga'));
            const namaPaket = selectedOption.getAttribute('data-nama');
            const orderId = 'PANEL-' + Date.now();

            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');

            // Simulasi pemanggilan Snap Token (Catatan: Untuk production/live nanti token harus dibuat dari backend/server backend, namun untuk uji coba frontend kita gunakan simulasi atau endpoint backend kamu)
            // Karena ini berjalan di GitHub Pages statis, kita bisa arahkan atau sambungkan ke backend API atau langsung uji coba frontend Midtrans.
            
            setTimeout(() => {
                alert("Simulasi: Data pesanan atas nama " + nama + " untuk " + namaPaket + " (Rp " + harga + ") berhasil diproses! (Catatan: Untuk integrasi QRIS otomatis penuh secara live, diperlukan backend server kecil seperti PHP/Node.js).");
                document.getElementById('form-section').classList.remove('hidden');
                document.getElementById('loading-section').classList.add('hidden');
            }, 1500);
        }
    </script>
</body>
</html>
