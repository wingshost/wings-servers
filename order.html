<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Server - Wings Host</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">Form Pembayaran Server</h1>
        
        <form onsubmit="generateQris(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Nominal Pembayaran (Rp):</label>
                <!-- Nilai default diset otomatis ke 2000, atau bisa otomatis membaca parameter URL jika ada dari panel -->
                <input type="number" id="nominal" value="2000" class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-600 focus:outline-none focus:border-indigo-500 text-white" required>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Keterangan / Paket Server:</label>
                <input type="text" id="keterangan" value="Pembayaran Server Wings" class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-600 focus:outline-none focus:border-indigo-500 text-white" required>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg">
                Buat QRIS Sekarang
            </button>
        </form>

        <!-- Area Tampil Status & QRIS Hasil -->
        <div id="qrisContainer" class="hidden flex flex-col items-center justify-center bg-white p-4 rounded-lg mt-6 text-black shadow-inner">
            <p class="text-xs font-bold text-slate-700 mb-1">SUPRIYANTI, Digital & Kreatif</p>
            <p class="text-[10px] text-slate-500 mb-1">NMID: ID1026539699615</p>
            
            <!-- Menampilkan nominal pembayaran secara otomatis dan akurat -->
            <div class="bg-slate-100 px-3 py-1 rounded-md mb-3 text-center border border-slate-200 w-full">
                <span class="text-xs text-slate-600">Total Tagihan:</span>
                <p class="text-base font-bold text-emerald-600">Rp <span id="displayNominal">0</span></p>
            </div>

            <!-- Gambar QRIS Utama -->
            <img id="qrisImage" src="qris.jpeg" alt="QRIS Supriyanti" class="w-48 h-48 object-contain mb-2 border border-slate-200 rounded">

            <p class="text-xs text-slate-500 font-medium text-center">Scan pakai GoPay, OVO, Dana, BCA, dll</p>
        </div>
    </div>

    <script>
        // Fitur otomatis membaca harga jika dikirim dari panel lewat URL (contoh: order.html?nominal=2000)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const nominalParam = urlParams.get('nominal');
            const paketParam = urlParams.get('paket') || urlParams.get('keterangan');

            if (nominalParam) {
                document.getElementById('nominal').value = nominalParam;
            }
            if (paketParam) {
                document.getElementById('keterangan').value = paketParam;
            }
        });

        function generateQris(event) {
            event.preventDefault();
            
            const nominalInput = document.getElementById('nominal').value;
            const nominal = Number(nominalInput);

            // Validasi nominal
            if(!nominal || nominal <= 0) {
                alert('Mohon masukkan nominal pembayaran yang valid!');
                return;
            }

            // Tampilkan nominal asli dengan format ribuan (misal: 2.000)
            document.getElementById('displayNominal').innerText = nominal.toLocaleString('id-ID');

            // Tampilkan kotak QRIS container
            const container = document.getElementById('qrisContainer');
            container.classList.remove('hidden');

            // Scroll otomatis ke bawah melihat QRIS
            container.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
