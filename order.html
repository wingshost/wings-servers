<script>
    function simulateAutoCreateServer() {
        // Simulasi data akun panel yang otomatis digenerate sistem untuk buyer ini
        const randomId = Math.floor(Math.random() * 900) + 100;
        const autoData = {
            username: "buyer_wings" + randomId,
            password: "pass" + Math.random().toString(36.substring(2, 8)),
            panelUrl: "serv.wingsserver.my.id",
            status: "Online & Stabil"
        };

        // Simpan data otomatis ke localStorage agar bisa dibaca di dashboard.html
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('panelData', JSON.stringify(autoData));

        alert("Pembayaran terkonfirmasi! Server berhasil dibuat otomatis di panel.");
        window.location.href = 'dashboard.html';
    }
</script>
