<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Pembayaran - Wings Servers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b132b] text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#1c2541] p-6 rounded-2xl shadow-2xl border border-gray-800">
        <h1 class="text-2xl font-bold text-center mb-6 text-cyan-400">Checkout Pembayaran</h1>
        
        <form onsubmit="generateQris(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Paket Server:</label>
                <input type="text" id="keterangan" readonly class="w-full px-4 py-2.5 rounded-lg bg-[#0b132b] border border-gray-700 text-gray-300 cursor-not-allowed">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Nominal Pembayaran (Rp):</label>
                <input type="number" id="nominal" readonly class="w-full px-4 py-2.5 rounded-lg bg-[#0b132b] border border-gray-700 text-gray-300 cursor-not-allowed">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg">
                Tampilkan QRIS Pembayaran
            </button>
        </form>

        <!-- Area Tampil QRIS Hasil -->
        <div id="qrisContainer" class="hidden flex flex-col items-center justify-center bg-white p-4 rounded-lg mt-6 text-black shadow-inner">
            <p class="text-xs font-bold text-gray-700 mb-1">SUPRIYANTI, Digital & Kreatif</p>
            <p class="text-[10px] text-gray-500 mb-1">NMID: ID1026539699615</p>
            
            <!-- Menampilkan rincian paket dan tagihan pas sesuai panel -->
            <div class="bg-gray-100 p-2 rounded-md mb-3 text-center border border-gray-200 w-full">
                <p class="text-xs text-gray-600 font-medium" id="displayPaket">-</p>
                <p class="text-lg font-bold text-emerald-600">Rp <span id="displayNominal">0</span></p>
            </div>

            <!-- Gambar QRIS Utama -->
            <img id="qrisImage" src="qris.jpeg" alt="QRIS Supriyanti" class="w-48 h-48 object-contain mb-2 border border-gray-200 rounded">

            <p class="text-xs text-gray-500 font-medium text-center">Scan pakai GoPay, OVO, Dana, BCA, dll</p>
        </div>
    </div>

    <script>
        // Otomatis membaca paket dan nominal dari URL saat halaman dibuka
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const nominalParam = urlParams.get('nominal');
            const paketParam = urlParams.get('paket');

            if (nominalParam) {
                document.getElementById('nominal').value = nominalParam;
            }
            if (paketParam) {
                document.getElementById('keterangan').value = paketParam;
            }
        });

        function generateQris(event) {
            event.preventDefault();
            
            const nominalInput = document.getElementById('nominal').value;
            const keteranganInput = document.getElementById('keterangan').value;
            const nominal = Number(nominalInput);

            if(!nominal || nominal <= 0) {
                alert('Silakan pilih paket server terlebih dahulu dari halaman utama!');
                window.location.href = 'index.html';
                return;
            }

            // Masukkan data ke kotak tampilan QRIS
            document.getElementById('displayNominal').innerText = nominal.toLocaleString('id-ID');
            document.getElementById('displayPaket').innerText = keteranganInput;

            // Tampilkan kotak QRIS container
            const container = document.getElementById('qrisContainer');
            container.classList.remove('hidden');

            // Scroll otomatis ke bawah
            container.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
