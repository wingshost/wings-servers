<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Pembayaran - Wings Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700 text-center">
        <h1 class="text-2xl font-bold mb-2 text-blue-400">Konfirmasi Pembayaran QRIS</h1>
        <p class="text-gray-400 text-sm mb-6">Selesaikan pembayaran untuk membuat server secara instan.</p>

        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 mb-6 text-left">
            <p class="text-sm text-gray-300">Paket Pilihan: <span id="txtPaket" class="font-bold text-blue-300">Node.js Hosting</span></p>
            <p class="text-sm text-gray-300 mt-1">Status: <span class="text-yellow-400 font-bold">Menunggu Konfirmasi</span></p>
        </div>

        <!-- Tombol Eksekusi Pembuatan Server Otomatis -->
        <button onclick="prosesPembuatanServerOtomatis()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition mb-3">
            [Mode Tes] Saya Sudah Bayar & Buat Server
        </button>

        <a href="index.html" class="text-sm text-gray-400 hover:underline">Kembali ke Beranda</a>
    </div>

    <!-- Script Penghubung Backend LocalTunnel -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const namaPaket = urlParams.get('paket') || 'Node.js 2GB';
        document.getElementById('txtPaket').innerText = namaPaket;

        async function prosesPembuatanServerOtomatis() {
            // URL LocalTunnel aktif terbaru
            let backendUrl = "https://warm-cars-sink.loca.lt";

            let username = prompt("Masukkan Username Panel Pterodactyl yang diinginkan:");
            let email = prompt("Masukkan Email Aktif Kakak:");

            if (!username || !email) {
                alert("Username dan Email wajib diisi!");
                return;
            }

            alert("Menghubungkan ke backend & membuat akun Pterodactyl... Mohon tunggu sebentar.");

            try {
                const response = await fetch(`${backendUrl}/api/create-server`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        eggType: 'nodejs20',
                        paket: namaPaket
                    })
                });

                const result = await response.json();

                if (result.success) {
                    let daftarServer = JSON.parse(localStorage.getItem('daftar_server_pterodactyl')) || [];
                    daftarServer.push(result.credentials);
                    localStorage.setItem('daftar_server_pterodactyl', JSON.stringify(daftarServer));
                    
                    alert("Berhasil! Server baru Anda telah ditambahkan.");
                    window.location.href = 'dashboard.html';
                } else {
                    alert("Gagal membuat server: " + result.message);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Gagal terhubung ke backend! Pastikan link LocalTunnel sudah di-bypass di tab baru.");
            }
        }
    </script>
</body>
</html>
