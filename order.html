<!-- Bagian Form Cek Ongkir di dalam order.html -->
<div style="margin: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h3>Cek Ongkir Komerce</h3>
    <label>ID Kota Asal:</label><br>
    <input type="text" id="origin" value="501" style="margin-bottom: 10px; width: 100%; padding: 5px;"><br>
    
    <label>ID Kota Tujuan:</label><br>
    <input type="text" id="destination" value="114" style="margin-bottom: 10px; width: 100%; padding: 5px;"><br>
    
    <label>Berat (gram):</label><br>
    <input type="text" id="weight" value="1000" style="margin-bottom: 10px; width: 100%; padding: 5px;"><br>
    
    <label>Kurir (jne, jnt, pos):</label><br>
    <input type="text" id="courier" value="jne" style="margin-bottom: 10px; width: 100%; padding: 5px;"><br>
    
    <button onclick="cekOngkir()" style="background-color: #ff5722; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px;">Cek Ongkir</button>

    <h4>Hasil:</h4>
    <pre id="hasil" style="background: #f4f4f4; padding: 10px;">Silakan klik tombol di atas...</pre>
</div>

<script>
    function cekOngkir() {
        const apiKey = "HVTDNnb60e9b3de3f00448abExVPifNj";
        const origin = document.getElementById("origin").value;
        const destination = document.getElementById("destination").value;
        const weight = document.getElementById("weight").value;
        const courier = document.getElementById("courier").value;

        fetch("https://api.rajaongkir.com/v2/cost", {
            method: "POST",
            headers: {
                "key": apiKey,
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: `origin=${origin}&destination=${destination}&weight=${weight}&courier=${courier}`
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById("hasil").innerText = JSON.stringify(data, null, 2);
        })
        .catch(error => {
            console.error("Error:", error);
            document.getElementById("hasil").innerText = "Terjadi kesalahan koneksi.";
        });
    }
</script>
