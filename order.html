<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Server - Wings Host</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">Form Pembayaran Server</h1>
        
        <form onsubmit="generateQris(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Nominal Pembayaran (Rp):</label>
                <input type="number" id="nominal" value="5000" class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-600 focus:outline-none focus:border-indigo-500 text-white" required>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Keterangan / Paket Server:</label>
                <input type="text" id="keterangan" value="Pembayaran Server Wings" class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-600 focus:outline-none focus:border-indigo-500 text-white" required>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg">
                Buat QRIS Sekarang
            </button>
        </form>

        <!-- Area Tampil QRIS Hasil -->
        <div id="qrisContainer" class="hidden flex flex-col items-center justify-center bg-white p-4 rounded-lg mt-6 text-black shadow-inner">
            <p class="text-xs font-bold text-slate-700 mb-1">SUPRIYANTI, Digital & Kreatif</p>
            <p class="text-[10px] text-slate-500 mb-2">NMID: ID1026539699615</p>

            <!-- Gambar QRIS Utama -->
            <img id="qrisImage" src="qris.jpeg" alt="QRIS Supriyanti" class="w-48 h-48 object-contain mb-2 border border-slate-200 rounded">

            <p class="text-xs text-slate-500 font-medium text-center">Scan pakai GoPay, OVO, Dana, BCA, dll</p>
        </div>
    </div>

    <script>
        function generateQris(event) {
            event.preventDefault();
            
            const nominal = document.getElementById('nominal').value;
            const keterangan = document.getElementById('keterangan').value;

            // Validasi sederhana
            if(!nominal || !keterangan) {
                alert('Mohon isi nominal dan keterangan!');
                return;
            }

            // Tampilkan kotak QRIS container yang tadinya hidden
            const container = document.getElementById('qrisContainer');
            container.classList.remove('hidden');

            // Scroll otomatis ke bawah melihat QRIS
            container.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
