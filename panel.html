<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINGS SERVERS - Pterodactyl Panel Hosting</title>

    <!-- SATPAM PENGECEK LOGIN -->
    <script>
        if(localStorage.getItem('isLoggedIn') !== 'true') {
            alert('Silakan login terlebih dahulu!');
            window.location.href = 'login.html';
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --cyan: #00f2fe;
            --blue: #4facfe;
            --dark-bg: #030712;
            --card-bg: rgba(13, 20, 38, 0.85);
            --border-glow: rgba(0, 242, 254, 0.25);
        }
        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyan);
        }
        .logout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tombol Keluar / Logout -->
        <button class="logout-btn" onclick="logout()">Logout Akun</button>

        <h1>WINGS SERVERS PANEL</h1>
        <p>Selamat datang! Kamu berhasil masuk ke halaman panel.</p>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('isLoggedIn');
            alert('Kamu telah keluar.');
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
