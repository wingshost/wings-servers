<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun - WINGS SERVERS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050811;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Efek Background 3D Grid Bergerak */
        .bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 500px;
            transform: rotateX(60deg) scale(2);
            transform-origin: top center;
            animation: gridMove 20s linear infinite;
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 80px; }
        }

        /* Efek Cahaya Orb 3D di Belakang */
        .glow-orb {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.15) 0%, rgba(0, 136, 255, 0.05) 50%, transparent 80%);
            z-index: -1;
            filter: blur(60px);
            pointer-events: none;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1f2937;
            position: relative;
            z-index: 10;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00ffff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover {
            color: #00ffff;
        }

        /* Register Container */
        .register-container {
            max-width: 420px;
            width: 90%;
            margin: 40px auto;
            background-color: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 5;
        }
        .register-container:hover {
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: 0 15px 40px rgba(0, 255, 255, 0.15);
        }
        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .register-header h2 {
            font-size: 24px;
            color: #00ffff;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        .register-header p {
            font-size: 13px;
            color: #9ca3af;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background-color: rgba(11, 15, 25, 0.8);
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
        }

        /* Submit Button */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #0b0f19;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.2);
            margin-top: 25px;
        }
        .submit-btn:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(0, 255, 255, 0.4);
            transform: scale(1.01);
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Efek Background 3D & Cahaya -->
    <div class="bg-3d"></div>
    <div class="glow-orb"></div>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">WINGS SERVERS</div>
        <div class="nav-links">
            <a href="https://wingshost.wingsserver.my.id">Utama</a>
            <a href="https://wingshost.wingsserver.my.id/panel.html">Panel</a>
        </div>
    </div>

    <!-- Register Form Container -->
    <div class="register-container">
        <div class="register-header">
            <h2>Buat Akun Baru</h2>
            <p>Daftar sekarang untuk mulai akses & beli panel server.</p>
        </div>

        <!-- Form Registrasi -->
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username kamu" required>
            </div>

            <div class="form-group">
                <label for="email">Email Aktif</label>
                <input type="email" id="email" name="email" placeholder="contoh@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required>
            </div>

            <button type="submit" class="submit-btn">Daftar & Masuk</button>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer-text">
        &copy; 2026 WINGS SERVERS. All rights reserved.
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman
            alert('Registrasi berhasil! Mengarahkan ke web utama...');
            window.location.href = 'https://wingshost.wingsserver.my.id';
        });
    </script>

</body>
</html>
