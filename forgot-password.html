<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - WINGS SERVERS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #030712; color: #ffffff; min-height: 100vh; overflow-x: hidden;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }
        .bg-3d-space {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 15% 20%, rgba(0, 255, 255, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(0, 136, 255, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #030712 100%);
            z-index: -2;
        }
        .bg-grid {
            position: fixed; top: 0; left: -50%; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 50px 50px; perspective: 600px;
            transform: rotateX(65deg) scale(1.5); transform-origin: top center;
            animation: gridMove 15s linear infinite; z-index: -1; opacity: 0.7;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }
        .navbar {
            display: flex; justify-content: space-between; align-items: center; padding: 20px 50px;
            background-color: rgba(11, 15, 25, 0.75); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1); position: relative; z-index: 10;
        }
        .logo { font-size: 22px; font-weight: bold; color: #00ffff; text-shadow: 0 0 15px rgba(0, 255, 255, 0.6); }
        .nav-links a { color: #9ca3af; text-decoration: none; margin-left: 20px; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: #00ffff; }
        .forgot-container {
            max-width: 420px; width: 90%; margin: 40px auto;
            background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(31, 41, 55, 0.8); border-radius: 14px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); position: relative; z-index: 5;
        }
        .forgot-header { text-align: center; margin-bottom: 25px; }
        .forgot-header h2 { font-size: 24px; color: #00ffff; margin-bottom: 8px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.3); }
        .forgot-header p { font-size: 13px; color: #9ca3af; line-height: 1.4; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 11px 14px; background-color: rgba(3, 7, 18, 0.8);
            border: 1px solid #374151; border-radius: 6px; color: #ffffff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-group input:focus { border-color: #00ffff; box-shadow: 0 0 8px rgba(0, 255, 255, 0.3); }
        .submit-btn {
            display: block; width: 100%; padding: 12px;
            background: linear-gradient(135deg, #00ffff, #0088ff); color: #030712;
            border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 255, 255, 0.25); margin-top: 10px;
        }
        .submit-btn:hover { opacity: 0.9; box-shadow: 0 6px 20px rgba(0, 255, 255, 0.45); }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #9ca3af; }
        .auth-footer a { color: #00ffff; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .footer-text { text-align: center; font-size: 12px; color: #6b7280; padding: 20px; }
    </style>
</head>
<body>
    <div class="bg-3d-space"></div>
    <div class="bg-grid"></div>

    <div class="navbar">
        <div class="logo">WINGS SERVERS</div>
        <div class="nav-links">
            <a href="https://wingshost.wingsserver.my.id">Utama</a>
            <a href="https://wingshost.wingsserver.my.id/login.html">Login</a>
        </div>
    </div>

    <div class="forgot-container">
        <div class="forgot-header">
            <h2>Pemulihan Password</h2>
            <p>Masukkan email terdaftar untuk menerima instruksi reset password.</p>
        </div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Email Akun</label>
                <input type="email" id="email" placeholder="contoh@gmail.com" required>
            </div>
            <button type="submit" class="submit-btn">Kirim Link Reset</button>
        </form>

        <div class="auth-footer">
            Ingat password? <a href="https://wingshost.wingsserver.my.id/login.html">Login di sini</a>
        </div>
    </div>

    <div class="footer-text">&copy; 2026 WINGS SERVERS. All rights reserved.</div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Instruksi reset password telah dikirim ke email kamu!');
            window.location.href = 'https://wingshost.wingsserver.my.id/login.html';
        });
    </script>
</body>
</html>
