<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wings Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

    <div class="max-w-4xl w-full bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Dashboard Server Anda</h1>
                <p class="text-gray-400 text-sm">Semua daftar server dan akun panel Pterodactyl Anda.</p>
            </div>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold transition">+ Beli Server Baru</a>
        </div>

        <!-- Tempat Daftar Server Dimuat -->
        <div id="containerServer" class="space-y-4">
            <!-- Server akan dimuat otomatis lewat JavaScript di bawah -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('containerServer');
            
            // Ambil semua daftar server dari localStorage
            let daftarServer = JSON.parse(localStorage.getItem('daftar_server_pterodactyl')) || [];

            if (daftarServer.length === 0) {
                container.innerHTML = `
                    <div class="bg-gray-900 p-6 rounded-lg border border-gray-700 text-center text-gray-400">
                        Belum ada server yang dibeli. Silakan buat pesanan baru terlebih dahulu!
                    </div>
                `;
                return;
            }

            // Bersihkan container
            container.innerHTML = '';

            // Looping dan tampilkan setiap server
            daftarServer.forEach((serv, index) => {
                let cardHTML = `
                    <div class="bg-gray-900 p-5 rounded-lg border border-gray-700">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-lg text-green-400">🖥️ Server #${index + 1}: ${serv.serverName || 'Node.js Server'}</h3>
                            <span class="bg-green-900 text-green-300 text-xs px-3 py-1 rounded-full font-bold">Aktif</span>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm bg-gray-800 p-3 rounded-lg">
                            <div>
                                <span class="text-gray-400 text-xs block">Username Panel:</span>
                                <span class="font-bold text-white">${serv.username}</span>
                            </div>
                            <div>
                                <span class="text-gray-400 text-xs block">Password Sementara:</span>
                                <span class="font-bold text-yellow-400">${serv.password}</span>
                            </div>
                            <div>
                                <span class="text-gray-400 text-xs block">URL Panel:</span>
                                <a href="${serv.panelUrl || 'https://serv.wingsserver.my.id'}" target="_blank" class="font-bold text-blue-400 hover:underline">Buka Panel →</a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        });
    </script>
</body>
</html>
