<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WINGS SERVERS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #060a17;
            background-image: 
                linear-gradient(to right, rgba(14, 165, 233, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(14, 165, 233, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .card-hd {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(11, 19, 43, 0.95) 100%);
            border: 1px solid rgba(34, 211, 238, 0.25);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="flex justify-between items-center px-6 md:px-10 py-6 border-b border-cyan-950/50 bg-[#060a17]/80 backdrop-blur-md">
        <a href="index.html" class="text-cyan-400 font-extrabold text-xl md:text-2xl tracking-wider drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]">WINGS SERVERS</a>
        <a href="index.html" class="text-gray-400 hover:text-cyan-400 text-sm">← Kembali ke Beranda</a>
    </nav>

    <!-- Form Login Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="card-hd p-8 rounded-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-cyan-400 mb-2">Masuk ke Akun</h1>
                <p class="text-gray-400 text-xs">Silakan masukkan email dan password Kakak</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs text-gray-300 mb-2 font-medium">Email / Username</label>
                    <input type="text" id="email" required placeholder="nama@email.com" class="w-full bg-slate-900/80 border border-cyan-900/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-2 font-medium">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900/80 border border-cyan-900/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                </div>
                <button type="submit" class="w-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold py-3 rounded-xl transition shadow-[0_0_15px_rgba(34,211,238,0.4)]">
                    Masuk Sekarang
                </button>
            </form>

            <p class="text-center text-xs text-gray-400 mt-6">
                Belum punya akun? <a href="register.html" class="text-cyan-400 hover:underline font-semibold">Daftar Akun</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-gray-500 border-t border-cyan-950/30">
        &copy; 2026 WINGS SERVERS. All rights reserved.
    </footer>

    <!-- Script Proses Login -->
    <script>
        function handleLogin(event) {
            event.preventDefault(); // Mencegah form reload halaman secara default
            
            // Simpan status login ke memori browser
            localStorage.setItem('isLoggedIn', 'true');

            // Diarahkan kembali ke beranda (index.html) yang ada daftar harga paketnya
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
