<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Akun - WINGS SERVERS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #030712; color: #ffffff; min-height: 100vh; overflow-x: hidden;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }
        .bg-3d-space {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 15% 20%, rgba(0, 255, 255, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(0, 136, 255, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #030712 100%);
            z-index: -2;
        }
        .login-container {
            max-width: 400px; width: 90%; margin: 80px auto; background: rgba(11, 15, 25, 0.95);
            border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 14px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); text-align: center;
        }
        h2 { color: #00ffff; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.3); }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 5px; }
        .form-group input {
            width: 100%; padding: 10px 12px; background: rgba(3, 7, 18, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.15); border-radius: 6px; color: #ffffff; font-size: 14px;
        }
        .form-group input:focus { border-color: #00ffff; outline: none; box-shadow: 0 0 8px rgba(0, 255, 255, 0.25); }
        .btn-submit {
            width: 100%; padding: 11px; background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #030712; border: none; border-radius: 6px; font-weight: bold; font-size: 14px;
            cursor: pointer; margin-top: 10px; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        .btn-submit:hover { opacity: 0.9; }
        .footer-text { text-align: center; font-size: 12px; color: #6b7280; padding: 20px; }
        .link-sub { display: block; margin-top: 15px; font-size: 13px; color: #9ca3af; text-decoration: none; }
        .link-sub a { color: #00ffff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="bg-3d-space"></div>

    <div class="login-container">
        <h2>LOGIN AKUN</h2>
        <!-- Form Login -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="usernameInput" placeholder="Masukkan username kamu..." required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="Masukkan password..." required>
            </div>
            <button type="submit" class="btn-submit">Masuk ke Panel</button>
        </form>
        <a href="register.html" class="link-sub">Belum punya akun? <a href="register.html">Daftar</a></a>
    </div>

    <div class="footer-text">&copy; 2026 WINGS SERVERS. All rights reserved.</div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // Mencegah form reload halaman secara default
            
            // Ambil nilai dari inputan username
            const username = document.getElementById('usernameInput').value;

            // SIMPAN KE LOCALSTORAGE SUPAYA MUNCUL DI INDEX.HTML
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', username);

            // Arahkan kembali ke halaman utama (index.html)
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
